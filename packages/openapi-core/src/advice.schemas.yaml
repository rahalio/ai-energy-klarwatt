openapi: 3.1.0
info:
  title: Klarwatt Advice API schemas
  version: 0.1.0
  description: Energy management recommendations with savings estimates and confidence.
paths: {}
components:
  schemas:
    AdviceRecommendation:
      type: object
      required:
      - id
      - accountId
      - recommendation
      - confidence
      properties:
        id:
          type: string
        accountId:
          type: string
        recommendation:
          type: string
          enum:
          - shift_usage_to_cheaper_band
          - reduce_standby_load
          - heating_schedule_change
          - tariff_switch_eligible
          - insulation_or_retrofit_referral
          - smart_thermostat_referral
        estimatedAnnualSaving:
          $ref: ./common/klarwatt-shared.yaml#/components/schemas/Money
        confidence:
          type: number
          format: float
        granularityUsed:
          $ref: ./common/klarwatt-shared.yaml#/components/schemas/MeteringGranularity
        policyReference:
          type: string
        financialConsequence:
          type: boolean
    AdviceRecommendationListResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdviceRecommendation'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
