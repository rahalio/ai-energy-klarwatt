apis:
  identity:
    root: src/identity.yaml
  contacts:
    root: src/contacts.yaml
  consumption:
    root: src/consumption.yaml
  consent:
    root: src/consent.yaml
  vulnerability:
    root: src/vulnerability.yaml
  resolutions:
    root: src/resolutions.yaml
  advice:
    root: src/advice.yaml
  complaints:
    root: src/complaints.yaml
  cohorts:
    root: src/cohorts.yaml
  compliance:
    root: src/compliance.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
